<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Network / Pulse Waves (Wi-Fi / Latency aesthetic) -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="#334155" stroke-width="8" opacity="0.4" />
  <path d="M 120 200 A 180 180 0 0 1 392 200" fill="none" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round" />
  <path d="M 165 240 A 120 120 0 0 1 347 240" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
  <path d="M 210 280 A 60 60 0 0 1 302 280" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" />

  <!-- Center Core Node -->
  <circle cx="256" cy="320" r="24" fill="url(#accentGrad)" />
  
  <!-- Server / Router Base Bar -->
  <rect x="156" y="380" width="200" height="34" rx="10" fill="#1e293b" stroke="#475569" stroke-width="4" />
  <circle cx="186" cy="397" r="5" fill="#10b981" />
  <circle cx="206" cy="397" r="5" fill="#3b82f6" />
  <circle cx="226" cy="397" r="5" fill="#f59e0b" />
</svg>
